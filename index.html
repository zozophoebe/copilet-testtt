<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5f2" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="page-header">
          <p class="eyebrow">日常整理</p>
          <div class="heading-row">
            <h1 id="page-title">
              待辦清單<span class="title-mark" aria-hidden="true">.</span>
            </h1>
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-pressed="false"
            >
              <span class="theme-icon" id="theme-icon" aria-hidden="true"
                >🌙</span
              >
              <span id="theme-label">深色模式</span>
            </button>
          </div>
          <p class="subtitle">把想做的事，一件一件完成。</p>
        </header>

        <form class="add-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來要做什麼？"
            autocomplete="off"
            maxlength="240"
          />
          <button class="add-button" type="submit">
            <span aria-hidden="true">＋</span>
            <span>新增</span>
          </button>
        </form>

        <nav class="filter-bar" aria-label="篩選待辦事項">
          <button
            class="filter-button is-active"
            type="button"
            data-filter="all"
            aria-pressed="true"
          >
            全部
          </button>
          <button
            class="filter-button"
            type="button"
            data-filter="active"
            aria-pressed="false"
          >
            未完成
          </button>
          <button
            class="filter-button"
            type="button"
            data-filter="completed"
            aria-pressed="false"
          >
            已完成
          </button>
        </nav>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>
        <p class="empty-state" id="empty-state" aria-live="polite">
          還沒有任何待辦事項，新增一個吧!
        </p>

        <footer class="list-footer">
          <span class="count-label">待完成</span>
          <span class="count-value" id="todo-count" aria-live="polite"
            >0 項</span
          >
        </footer>
      </section>
      <p class="page-note">每一步都算數</p>
    </main>
  </body>
</html>
